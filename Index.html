:root{--g:linear-gradient(115deg,#0b665f 0%,#159b89 48%,#8be3c3 100%);--bg:#071312;--sf:#0e211f;--in:#132b28;--bt:#1a3935;--tx:#e9f8f3;--mu:#91b6aa;--ln:#20413b;--ac:#159b89;--lk:#8be3c3;--dg:#ff7185;--like:#8be3c3;--ok:#69d7ad}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg)}body{color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}

const B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
const b32enc=b=>{let bits='',o='';for(const x of b)bits+=x.toString(2).padStart(8,'0');for(let i=0;i<bits.length;i+=5)o+=B32[parseInt(bits.slice(i,i+5).padEnd(5,'0'),2)];return o};
const b32dec=s=>{let bits='';for(const c of s)bits+=B32.indexOf(c).toString(2).padStart(5,'0');const o=[];for(let i=0;i+8<=bits.length;i+=8)o.push(parseInt(bits.slice(i,i+8),2));return new Uint8Array(o)};
async function totp(secret,step){const k=await crypto.subtle.importKey('raw',b32dec(secret),{name:'HMAC',hash:'SHA-1'},false,['sign']),m=new Uint8Array(8);let c=step;for(let i=7;i>=0;i--){m[i]=c&255;c=Math.floor(c/256)}const h=new Uint8Array(await crypto.subtle.sign('HMAC',k,m)),o=h[19]&15;return String((((h[o]&127)<<24)|(h[o+1]<<16)|(h[o+2]<<8)|h[o+3])%1e6).padStart(6,'0')}
const totpOk=async(secret,code)=>{try{const s=Math.floor(now()/30000);for(const d of[-1,0,1])if(await totp(secret,s+d)===String(code).trim())return true}catch{}return false};

/* ===== autenticação e cadastro ===== */
function authView(mode='login'){
 const titles={login:'Entre na sua PINXORA',register:'Crie sua conta',forgot:'Recupere seu acesso',reset:'Defina uma nova senha'};
 const intro={login:'Entre com seu e-mail e senha para continuar.',register:'Crie seu perfil e encontre sua comunidade.',forgot:'Enviaremos um link seguro para seu e-mail.',reset:'Escolha uma senha nova para sua conta.'};
 let fields='';
 if(mode==='register') fields=`<label class="f">Nick (nome de usuário)</label><input name="u" autocomplete="username" autocapitalize="none" maxlength="30" placeholder="ex.: seu.nick" required><label class="f">E-mail</label><input name="email" type="email" autocomplete="email" required><label class="f">Senha</label><input name="p" type="password" minlength="8" autocomplete="new-password" required><label class="f">Confirmar senha</label><input name="p2" type="password" minlength="8" autocomplete="new-password" required><div class="sm mu" style="margin-top:7px">Use de 8 a 72 caracteres. O nick deve ter de 3 a 30 caracteres.</div>`;

async function syncCloud(){

 try{

  const cloudComments=S.posts.flatMap(p=>(p.comments||[]).filter(c=>c.uid===me.id&&UUID_RE.test(c.id)&&UUID_RE.test(p.id)&&!knownCommentIds.has(c.id)).map(c=>({id:c.id,post_id:p.id,user_id:c.uid,body:c.body,created_at:new Date(c.t||now()).toISOString()})));
  if(cloudComments.length){const {error}=await sb.from('comments').insert(cloudComments);if(error)throw error;cloudComments.forEach(c=>knownCommentIds.add(c.id))}
  const liveCommentIds=new Set(S.posts.flatMap(p=>(p.comments||[]).map(c=>c.id)).filter(id=>UUID_RE.test(id)));const goneComments=[...knownCommentIds].filter(id=>!liveCommentIds.has(id));if(goneComments.length){const {error}=await sb.from('comments').delete().in('id',goneComments);if(error)throw error;goneComments.forEach(id=>knownCommentIds.delete(id))}

  for(const p of S.posts.filter(p=>UUID_RE.test(p.id))){const rows=(p.likes||[]).filter(id=>id===me.id&&UUID_RE.test(id)).map(id=>({post_id:p.id,user_id:id}));if(rows.length){const {error}=await sb.from('post_likes').upsert(rows,{onConflict:'post_id,user_id',ignoreDuplicates:true});if(error)throw error;rows.forEach(l=>knownLikeKeys.add(l.post_id+':'+l.user_id))}}
  const liveLikeKeys=new Set(S.posts.flatMap(p=>(p.likes||[]).filter(UUID_RE.test.bind(UUID_RE)).map(id=>p.id+':'+id)));for(const key of [...knownLikeKeys])if(!liveLikeKeys.has(key)&&key.endsWith(':'+me.id)){const postId=key.split(':')[0];const {error}=await sb.from('post_likes').delete().eq('post_id',postId).eq('user_id',me.id);if(error)throw error;knownLikeKeys.delete(key)}

  const readIds=S.msgs.filter(m=>m.to===me.id&&m.read&&UUID_RE.test(m.id)).map(m=>m.id);if(readIds.length){const {error}=await sb.from('messages').update({read_at:new Date().toISOString()}).in('id',readIds);if(error)throw error}

}
